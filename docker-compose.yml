services:
  app:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-limitedgauntlet}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-limitedgauntlet}
      PORT: 8080
      HOST: 0.0.0.0
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    ports:
      # Host access for local (non-Docker) dev — `npm run dev:server` needs
      # to reach this directly. The app container above never uses this
      # port; it talks to `db` over the internal compose network.
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-limitedgauntlet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-limitedgauntlet}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-limitedgauntlet}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
