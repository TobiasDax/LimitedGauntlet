services:
  app:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-limitedgauntlet}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-limitedgauntlet}
      PORT: 8080
      HOST: 0.0.0.0
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    # No host port published — the app container reaches this over the
    # internal compose network, and Postgres has no business being
    # reachable from outside Docker at all in a normal deployment. Local
    # (non-Docker) dev via `npm run dev:server` needs a host port to reach
    # this directly; add `ports: ["5432:5432"]` for `db` in a
    # docker-compose.override.yml for that (see docs/deployment.md),
    # rather than exposing it by default for everyone.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-limitedgauntlet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-limitedgauntlet}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-limitedgauntlet}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
